apply plugin: 'com.android.application'

def releaseSigningPropertiesPath = System.getenv("CODEX_ANDROID_SIGNING_PROPERTIES")
def releaseSigningProperties = new Properties()
def releaseSigningPropertiesFile = null
def releaseSigningStoreFile = null
def releaseSigningConfigured = false
if (releaseSigningPropertiesPath) {
    releaseSigningPropertiesFile = file(releaseSigningPropertiesPath)
    if (!releaseSigningPropertiesFile.exists()) {
        throw new GradleException("Android Release signing properties were not found: " + releaseSigningPropertiesPath)
    }
    releaseSigningPropertiesFile.withInputStream { releaseSigningProperties.load(it) }
    def requiredSigningKeys = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
    def missingSigningKeys = requiredSigningKeys.findAll {
        !releaseSigningProperties.getProperty(it)?.trim()
    }
    if (!missingSigningKeys.isEmpty()) {
        throw new GradleException(
            "Android Release signing properties are incomplete: " + missingSigningKeys.join(', ')
        )
    }
    releaseSigningStoreFile = new File(releaseSigningProperties.getProperty('storeFile'))
    if (!releaseSigningStoreFile.isAbsolute()) {
        releaseSigningStoreFile = new File(
            releaseSigningPropertiesFile.parentFile,
            releaseSigningProperties.getProperty('storeFile')
        )
    }
    if (!releaseSigningStoreFile.exists()) {
        throw new GradleException(
            "Android Release keystore was not found: " + releaseSigningStoreFile
        )
    }
    releaseSigningConfigured = true
}

android {
    namespace "com.wlyaaaaa.codexlocalremote.mobile"
    compileSdk rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "com.wlyaaaaa.codexlocalremote.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 7
        versionName "1.6"
        ndk {
            abiFilters 'arm64-v8a'
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile releaseSigningStoreFile
                storeType releaseSigningProperties.getProperty('storeType', 'JKS')
                storePassword releaseSigningProperties.getProperty('storePassword')
                keyAlias releaseSigningProperties.getProperty('keyAlias')
                keyPassword releaseSigningProperties.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
